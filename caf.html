<body>

    <div class="container mt-4">
        <img class="img-fluid mx-auto d-block header-image" src="./img/cafPageHeadImg.jpg" alt="A cartoon depiciton of a cafeteria">
        <h2 class="text-center">This is the cafeteria menu<br>The following items are available for today's Meals</h2>

        <div class="row text">
            <div class="col-md-4">
                <h3 class="text-center">Breakfast</h3>
                <ul>
                    <li>Scrambled Eggs</li>
                    <li>Bacon</li>
                    <li>Toast</li>
                </ul>
            </div>
            <div class="col-md-4">

                    <li>Grilled Cheese</li>
                    <li>Tomato Soup</li>
                    <li>Fruit Cup</li>
                </ul>
            </div>
            <div class="col-md-4">
                <h3 class="text-center">Dinner</h3>
                <ul>
                    <li>Spaghetti Carbonara</li>
